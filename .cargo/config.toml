# Android 交叉编译配置。
#
# 两个坑都踩过，记在这里：
#
# 1. opus 的 C 库通过 cmake 构建，而 cmake 的 Android 工具链
#    必须靠 CMAKE_TOOLCHAIN_FILE 或 ANDROID_NDK_HOME 才能找到。
#
# 2. 直接写 aarch64-linux-android-clang 会默认用 API 24 链接，
#    但 cpal 的 AAudio 后端需要 -laaudio，而这个库在 NDK 里
#    只存在于 API 26 及以上的目录。所以链接器必须显式带 API 级别。
#    NDK 版本变了要同步改这里的路径。

[target.aarch64-linux-android]
ar = "aarch64-linux-android-ar"
linker = "aarch64-linux-android26-clang"

[target.armv7-linux-androideabi]
ar = "arm-linux-androideabi-ar"
linker = "armv7a-linux-androideabi26-clang"

[target.i686-linux-android]
ar = "i686-linux-android-ar"
linker = "i686-linux-android26-clang"

[target.x86_64-linux-android]
ar = "x86_64-linux-android-ar"
linker = "x86_64-linux-android26-clang"
