[workspace]
resolver = "2"
members = [
    "crates/kanami-proto",
    "crates/kanami-audio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
kanami-proto = { path = "crates/kanami-proto" }
kanami-audio = { path = "crates/kanami-audio" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
