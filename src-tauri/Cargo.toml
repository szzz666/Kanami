[package]
name = "kanami"
version = "0.1.0"
description = "局域网实时音频传输"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kanami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kanami-proto.workspace = true
kanami-audio.workspace = true
kanami-net.workspace = true
kanami-engine.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow.workspace = true
parking_lot.workspace = true
log.workspace = true
env_logger.workspace = true
uuid = { version = "1", features = ["v4"] }

# 托盘与菜单是桌面专属能力，移动端没有对应概念
[target.'cfg(desktop)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux", target_os = "android", target_os = "ios"))'.dependencies]
cpal.workspace = true
